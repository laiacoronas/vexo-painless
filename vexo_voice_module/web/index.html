<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexo · Voice</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:transparent;color:#1e2733;font:14px system-ui,sans-serif}main{margin:0;padding:4px;background:white}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:18px;font-weight:760;margin:0}#status{padding:6px 12px;border-radius:30px;background:#e9edf2;color:#6e7785;font-size:12px;font-weight:800;white-space:nowrap}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:20px;padding:12px;background:#f5f7fa;border-radius:12px}button{background:#dce8f6;color:#285475;border:1px solid transparent;border-radius:30px;padding:10px 16px;font:700 13px system-ui,sans-serif;cursor:pointer;transition:background .15s}button:hover{background:#cbdff1}button:focus-visible,input:focus-visible{outline:2px solid #35658b;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.active button{background:#e9edf2;color:#465363}label{display:flex;gap:9px;align-items:center;color:#6b7482;font-size:12px;font-weight:600;cursor:pointer}input[type=checkbox]{appearance:none;width:30px;height:18px;margin:0;border-radius:20px;background:#d5dce4;position:relative;cursor:pointer;flex-shrink:0}input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:white;transition:transform .15s}input[type=checkbox]:checked{background:#35658b}input[type=checkbox]:checked::after{transform:translateX(12px)}input:disabled{opacity:.5;cursor:default}#modeDescription,.empty{color:#78818e;font-size:12px;line-height:1.55;margin:12px 0}.role{color:#6b7482;font-size:11px;font-weight:700;line-height:1.4;margin-bottom:5px}.line{max-width:88%;padding:12px 14px;border-radius:14px;flex-shrink:0}.line.assistant{align-self:flex-start;background:#f5f7fa}.line.user{align-self:flex-end;background:#edf3fa}.line.user .role{color:#35658b}.line p{margin:0;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}#conversation{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#d5dce4 transparent;padding:16px 8px 12px 0;border-top:1px solid #edf0f5}.empty{margin:0!important;padding:8px 0}html,body{height:100%}main{height:100%;display:flex;flex-direction:column}header,.controls,#modeDescription,#scoreCard,#error{flex-shrink:0}#scoreCard{background:#f5f7fa;border-radius:12px;padding:12px;margin:12px 0}#scoreCard>div{font-size:11px;color:#6b7482}#score{font-size:26px;font-weight:770}#scale{color:#78818e;font-size:12px}#level{font-size:12px;margin-left:8px}.moderate{color:#97530f}.high,#error{color:#922d17}#rangeWarning,#error{font-size:12px;line-height:1.5}@media(max-width:400px){.controls{gap:10px;padding:10px}button{padding:10px 12px}}
</style></head><body><main>
<header><h1>Voice</h1><span id="status" role="status">Ready</span></header>
<div class="controls"><button id="start">Start conversation</button><label><input id="prediction" type="checkbox">Pain prediction</label></div>
<p id="modeDescription">Normal conversation</p>
<section id="scoreCard" hidden><div>Predicted pain</div><span id="score">—</span> <span id="scale">/ 10</span><span id="level"></span><p id="rangeWarning" hidden>Estimate outside the calibrated range.</p></section>
<p id="error" role="alert" hidden></p>
<div id="conversation" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text"><p class="empty" id="empty">Speak or play your recording into the microphone.</p></div>
</main><script type="module" src="/static/app.js"></script></body></html>
